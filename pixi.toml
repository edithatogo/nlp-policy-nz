[workspace]
name = "nlp-policy-nz"
version = "0.1.0"
description = "SOTA shared core NLP pipeline for New Zealand legislation and Hansard corpora"
authors = ["Maintainer"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11.15,<3.15"
pip = "*"
rust = ">=1.80.1"
vale = ">=3.0.7"
nodejs = ">=20"
git = "*"

[pypi-dependencies]
polars = ">=1.0.0"
pyarrow = ">=16.0.0"
spacy = { version = ">=3.7.5", env-markers = "python_version < '3.14'" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl", env-markers = "python_version < '3.14'" }
transformers = ">=5.5.4"
torch = { version = ">=2.13.0", env-markers = "python_version < '3.14'" }
bitsandbytes = { version = ">=0.42.0", env-markers = "python_version < '3.14'" }
msgspec = ">=0.18.6"
pydantic = ">=2.11.10"
jsonschema = ">=4.23.0"
orjson = ">=3.10.18"
beautifulsoup4 = ">=4.12.3"
types-beautifulsoup4 = ">=4.12.0.20250516"
narwhals = ">=1.0.6"
lancedb = ">=0.6.13"
networkx = ">=3.0"
ruff = ">=0.3.7"
tach = ">=0.5.0"
import-linter = ">=2.0"
complexipy = ">=0.2.2"
pytest = ">=8.0.2"
hypothesis = ">=6.90.1"
mutatest = ">=3.0.2"
pre-commit = ">=3.6.2"
maturin = ">=1.5.1"
requests = ">=2.31.0"
xmlschema = ">=3.4.5"
defusedxml = ">=0.7.1"
pypdf = ">=6.0.0"
PyYAML = ">=6.0.3"
gradio = ">=4.0.2"
plotly = ">=5.0.0"
rdflib = ">=7.0.0"
fastapi = ">=0.110.3"
uvicorn = ">=0.27.1"
opentelemetry-api = ">=1.25.0"
opentelemetry-sdk = ">=1.25.0"
opentelemetry-exporter-otlp = ">=1.25.0"
lingua-language-detector = ">=1.4.2,<3.0.0"
accelerate = ">=0.30.1"
peft = ">=0.11.1"
trl = ">=0.9.6"
wandb = ">=0.17.9"
memray = { version = ">=1.12.0", env-markers = "sys_platform != 'win32'" }
pytest-benchmark = ">=4.0.0"
pytest-cov = ">=5.0.0"
basedpyright = ">=1.28.5"
tqdm = ">=4.66.6"
pip-audit = ">=2.10.1"
cyclonedx-bom = ">=1.5.3"
cvss = ">=3.6"
bandit = ">=1.8.6"
detect-secrets = ">=1.5.0"
GitPython = ">=3.1.59"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.cpu.tasks]
runtime-profile = "python -c \"import platform; print(f'CPU runtime: {platform.python_version()}')\""

[feature.gpu.tasks]
gpu-check = "python -c \"import torch; raise SystemExit('CUDA is unavailable in this GPU environment') if not torch.cuda.is_available() else print(torch.cuda.get_device_name(0))\""

[feature.profiling.pypi-dependencies]
scalene = ">=1.5.55"

[feature.unstructured.pypi-dependencies]
unstructured = ">=0.15.14"

[feature.profiling.tasks]
profile-scalene = "scalene --reduced-profile --html --outfile docs/profiling.html src/nlp_policy_nz/cli/main.py process --help"

[feature.security.pypi-dependencies]
semgrep = ">=1.93.0"

[environments]
default = ["py312", "cpu"]
production = ["py312", "cpu"]
cpu = ["py312", "cpu"]
gpu = ["py312", "gpu"]
py311 = ["py311", "cpu"]
py312 = ["py312", "cpu"]
py313-experimental = ["py313", "cpu"]
py314-experimental = ["py314", "cpu"]
profiling = ["py312", "profiling"]
security = ["py312", "security"]
unstructured = ["py312", "unstructured"]

[tasks]
install-git-hooks = "pre-commit install"
lint = "ruff check . && vale docs/build_backend.md docs/pydantic_vs_msgspec.md docs/axiom-foundation-relevance.md"
lint-ci = "ruff check src/nlp_policy_nz/__init__.py src/nlp_policy_nz/cli/main.py src/nlp_policy_nz/guard/__init__.py tests/test_smoke.py tests/test_guard.py tests/benchmarks/test_vector_benchmark.py scripts/benchmark_tokenizers_chunking.py"
format = "ruff format ."
format-ci = "ruff format --check src/nlp_policy_nz/__init__.py src/nlp_policy_nz/cli/main.py src/nlp_policy_nz/guard/__init__.py tests/test_smoke.py tests/test_guard.py tests/benchmarks/test_vector_benchmark.py scripts/benchmark_tokenizers_chunking.py"
check-complexity = "python -X utf8 -m complexipy.main . --max-complexity-allowed 100"
check-boundaries = "tach check"
test = "pytest"
coverage = "pytest -p no:tach --ignore=tests/benchmarks --cov=src --cov-report=html --cov-report=xml"
coverage-ci = "pytest tests/smoke tests/test_quality_infrastructure.py tests/test_track23_evidence.py tests/test_smoke.py tests/test_akn_v3.py --cov=src --cov-report=xml --cov-report=html --cov-fail-under=0"
mutation = "mutatest --src src/nlp_policy_nz/ --tests tests/"
archive-assurance = "python scripts/archive_assurance.py"
profile = "pixi run -e profiling profile-scalene"
memray = "python scripts/memray_trace.py --help"
benchmark = "pytest tests/benchmarks -q"
qlora-spec = "python -m nlp_policy_nz.training.run_qlora --help"
track20-runtime = "python -c \"import sys; sys.path.insert(0, 'src'); from nlp_policy_nz.training.runtime import main; raise SystemExit(main())\""
track20-smoke = "python -c \"import sys; sys.path.insert(0, 'src'); from nlp_policy_nz.training.smoke import main; raise SystemExit(main())\""
typecheck = "basedpyright src"
typecheck-ci = "basedpyright --version && python -m py_compile src/nlp_policy_nz/__init__.py src/nlp_policy_nz/cli/main.py src/nlp_policy_nz/guard/__init__.py"
check = { depends-on = ["lint", "format", "check-complexity", "check-boundaries", "test"] }
